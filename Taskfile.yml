version: '3'

tasks:
  dev:
    desc: Run the application using air for hot-reloading
    cmds:
      - air

  kill-dev:
    desc: Kill any process occupying port 3000 (useful when air leaves a zombie process)
    cmds:
      - cmd: powershell -Command "Get-NetTCPConnection -LocalPort 3000 -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $$_.OwningProcess -Force -ErrorAction SilentlyContinue }; Write-Host 'Port 3000 cleared'"
        platforms: [windows]
      - cmd: lsof -ti:3000 | xargs kill -9 || true
        platforms: [linux, darwin]

  build:
    desc: Compile the application into a binary
    cmds:
      - go build -o bin/matoi.exe main.go

  prod:
    desc: Build the binary and run it
    deps: [build]
    cmds:
      - ./bin/matoi.exe

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  version:
    desc: Show the application version
    cmds:
      - go run main.go -version

  test-goquery:
    desc: Run the goquery prototype test script
    cmds:
      - go test -count=1 -v ./dev_tools -run TestGoquery

  qlty-all:
    desc: Run qlty check
    cmds:
      - qlty check --all

  qlty-smells:
    desc: Run qlty smells
    cmds:
      - qlty smells --all

  docs:generate:
    desc: "Generate static GH Pages index.html for Swagger UI"
    cmds:
      - go test -count=1 -v ./dev_tools -run TestGenerateDocsUI

  test-danbooru:
    desc: Run the Danbooru tags prototype test script
    cmds:
      - go test -count=1 -v ./dev_tools -run TestDanbooruTags

  flush-cache:
    desc: Flush Redis cache via dev tools
    cmds:
      - go test -count=1 -v ./dev_tools -run TestFlushCache

  test-matoi:
    desc: Run the comprehensive integration test for all Matoi providers
    cmds:
      - go test -count=1 -v ./dev_tools -run TestMatoi

  test-e621:
    desc: Run the e621 prototype test script
    cmds:
      - go test -count=1 -v ./dev_tools -run TestE621QuickQuery

  test-e926:
    desc: Run integration tests for the E926 provider
    cmds:
      - go test -count=1 -v ./dev_tools -run TestE926

  test-furbooru:
    desc: Run prototype test for the Furbooru provider
    cmds:
      - go test -count=1 -v ./dev_tools -run TestFurbooruPrototype

  test-derpibooru:
    desc: Run prototype test for the Derpibooru provider
    cmds:
      - go test -count=1 -v ./dev_tools -run TestDerpibooruPrototype

  test-realbooru:
    desc: Run prototype test for the Realbooru provider
    cmds:
      - go test -count=1 -v ./dev_tools -run TestRealbooruScraping

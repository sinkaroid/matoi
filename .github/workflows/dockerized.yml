name: Dockerized

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check if version changed
        id: check
        shell: bash
        run: |
          NEW_VERSION=$(grep -oP 'var AppVersion = "\K[^"]+' config/config.go || echo "0.0.0")
          OLD_VERSION=$(git show HEAD~1:config/config.go | grep -oP 'var AppVersion = "\K[^"]+' || echo "0.0.0")
          
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "image_tag=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Log into GitHub Container Registry
        if: steps.check.outputs.changed == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build and push Docker image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.check.outputs.image_name }}:${{ steps.check.outputs.image_tag }}
            ${{ steps.check.outputs.image_name }}:latest

      - name: Skip build log
        if: steps.check.outputs.changed == 'false'
        run: echo "No version change detected in config/config.go. Skipping Docker build/push."

basePath: /
definitions:
  handlers.DanbooruResponse:
    properties:
      count:
        type: integer
      posts:
        items:
          $ref: '#/definitions/models.Post'
        type: array
      provider:
        type: string
      success:
        type: boolean
    type: object
  handlers.GelbooruResponse:
    properties:
      count:
        type: integer
      posts:
        items:
          $ref: '#/definitions/models.Post'
        type: array
      provider:
        type: string
      success:
        type: boolean
    type: object
  handlers.GraphQLRequest:
    properties:
      operationName:
        type: string
      query:
        type: string
      variables:
        additionalProperties: true
        type: object
    type: object
  handlers.HomeResponse:
    properties:
      date:
        type: string
      endpoint:
        type: string
      heap:
        type: string
      message:
        type: string
      rss:
        type: string
      server:
        type: string
      success:
        type: boolean
      uptime:
        type: string
      version:
        type: string
    type: object
  handlers.PingResponse:
    properties:
      status:
        type: string
      success:
        type: boolean
    type: object
  handlers.QueryCompletionResponse:
    properties:
      success:
        type: boolean
      tags:
        items:
          type: string
        type: array
    type: object
  handlers.Rule34Response:
    properties:
      count:
        type: integer
      posts:
        items:
          $ref: '#/definitions/models.Post'
        type: array
      provider:
        type: string
      success:
        type: boolean
    type: object
  handlers.TbibResponse:
    properties:
      count:
        type: integer
      posts:
        items:
          $ref: '#/definitions/models.Post'
        type: array
      provider:
        type: string
      success:
        type: boolean
    type: object
  main.ErrorResponse:
    properties:
      reason:
        type: string
      success:
        type: boolean
    type: object
  models.Post:
    properties:
      directory:
        type: string
      file_url:
        type: string
      id:
        type: integer
      image:
        type: string
      link:
        type: string
      matoi_file_url:
        type: string
      matoi_preview_url:
        type: string
      matoi_sample_url:
        type: string
      preview_url:
        type: string
      rating:
        description: s (safe), q (questionable), e (explicit)
        type: string
      sample_url:
        type: string
      score:
        type: integer
      source:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
info:
  contact: {}
  description: REST API wrapper/binding for imageboard APIs (Danbooru, Gelbooru, Rule34).
  title: sinkaroid/matoi
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HomeResponse'
      summary: System info and health check
      tags:
      - system
  /api/danbooru/media:
    get:
      parameters:
      - description: Encoded Danbooru media URL
        in: query
        name: url
        required: true
        type: string
      responses:
        "200":
          description: Streams the media file
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Failed to fetch media
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Proxy and stream Danbooru media
      tags:
      - danbooru
  /api/danbooru/posts:
    get:
      description: Fetches a list of posts from Danbooru based on provided tags.
      parameters:
      - description: Tags to search for
        in: query
        name: tags
        type: string
      - description: Max results (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Shuffle the results
        in: query
        name: shuffle
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DanbooruResponse'
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Fetch posts from Danbooru
      tags:
      - danbooru
  /api/danbooru/query_completion:
    get:
      description: Provides tag completion via scraping Danbooru's tags directory
        (Eiyuu logic). Cached for 24 hours.
      parameters:
      - description: Tag prefix to search for
        in: query
        name: tags
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.QueryCompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Danbooru Tag Autocomplete
      tags:
      - danbooru
  /api/gelbooru/media:
    get:
      parameters:
      - description: Encoded Gelbooru media URL
        in: query
        name: url
        required: true
        type: string
      responses:
        "200":
          description: Streams the media file
        "400":
          description: Invalid parameters
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Failed to fetch media
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Proxy and stream Gelbooru media
      tags:
      - gelbooru
  /api/gelbooru/posts:
    get:
      parameters:
      - description: Space-separated tags
        in: query
        name: tags
        type: string
      - description: Max results (default 100, max 100)
        in: query
        name: limit
        type: integer
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GelbooruResponse'
        "502":
          description: Upstream fetch failed
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get posts from Gelbooru
      tags:
      - gelbooru
  /api/gelbooru/query_completion:
    get:
      description: Scrapes autocomplete tags from Gelbooru using wildcard matching.
        No cache enforcement.
      parameters:
      - description: Tag query to autocomplete (e.g. jeanne)
        in: query
        name: tags
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.QueryCompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get tag completion from Gelbooru (Eiyuu logic)
      tags:
      - gelbooru
  /api/graphql:
    post:
      consumes:
      - application/json
      parameters:
      - description: GraphQL Query
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/handlers.GraphQLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: GraphQL Endpoint
      tags:
      - graphql
  /api/hypnohub/media:
    get:
